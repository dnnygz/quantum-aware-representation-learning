project_id: TCGA-BRCA
cohort_version: v1
cohort_status: canonical

gdc:
  api_base_url: https://api.gdc.cancer.gov
  files_endpoint: /files
  cases_endpoint: /cases
  data_endpoint: /data
  status_endpoint: /status
  timeout_seconds: 120
  max_retries: 5
  page_size: 2000

query:
  data_category: Transcriptome Profiling
  data_type: Gene Expression Quantification
  experimental_strategy: RNA-Seq
  workflow_type: STAR - Counts
  sample_type: Primary Tumor
  access: open

clinical:
  primary_source: clinical_supplement_bcr_xml
  primary_field: er_status_by_ihc
  primary_xml_element: breast_carcinoma_estrogen_receptor_status
  primary_cde: "2957359"
  clinical_timepoint: baseline_primary_tumor
  prohibit_later_event_imputation: true
  biotab_crosscheck: true
  harmonized_role: secondary_validation
  er_gene_symbol: ESR1
  er_method: IHC
  positive_values: [Positive]
  negative_values: [Negative]
  ambiguous_values:
    - Equivocal
    - Indeterminate
    - Not Evaluated
    - Not Reported
    - Unknown
    - Not Available
  conflict_policy: exclude

expression:
  value_column: unstranded
  gene_id_column: gene_id
  gene_name_column: gene_name
  gene_type_column: gene_type
  technical_row_prefix: N_
  expected_gene_model: GENCODE v36
  output_dtype: int64

sample_selection:
  strategy: tcga_barcode_lexicographic
  sort_keys:
    - sample_submitter_id
    - portion_number
    - aliquot_submitter_id
    - sample_id
    - file_id

splits:
  random_seed: 1729
  test_size: 0.20
  n_splits: 5
  shuffle: true

preprocessing:
  specification_id: phase1b_primary_v1
  expression_filter:
    cpm_threshold: 1.0
    min_training_prevalence: 0.10
    selection_basis: prespecified_methodological_not_performance_optimized
  tmm:
    logratio_trim: 0.30
    sum_trim: 0.05
    weighted: true
    reference_selection: upper_quartile_closest_to_training_mean
  log_cpm:
    prior_count: 2.0
    prior_scaling: proportional_to_effective_library_size
  variance_filter:
    strategy: exact_zero_training_variance
  scaling:
    strategy: estimator_specific
    default_enabled: false
  diagnostics:
    extreme_factor_lower: 0.5
    extreme_factor_upper: 2.0
    robust_outlier_iqr_multiplier: 3.0
    ma_plot_max_points: 5000
  artifacts_dir: data/interim/preprocessing/phase1b_primary_v1
  qc_report: reports/data/preprocessing_qc.json
  provenance_report: reports/data/preprocessing_provenance.json

phase1c:
  protocol_version: phase1c_classical_baseline_v1
  status: frozen_approved_2026-10-08
  locked_test_policy: evaluate_once_after_inner_cv_model_selection
  inner_cv:
    n_splits: 5
    shuffle: true
    random_seed: 1729
    artifact: data/processed/splits/phase1c_inner_cv.json
    qc_report: reports/data/phase1c_protocol_qc.json
    provenance_report: reports/data/phase1c_protocol_provenance.json
  selection:
    primary_metric: roc_auc
    aggregation: mean_across_inner_validation_folds
    tie_breaker: smallest_C_then_lexicographic_parameter_order
    classical_reference_family: highest_selected_model_mean_cv_roc_auc
    classical_reference_tie_breaker: lexicographic_model_name
  class_imbalance:
    strategy: balanced_class_weight
    fit_scope: inner_training_labels_only
  classification_threshold:
    logistic_regression: 0.5
    linear_svm_decision_value: 0.0
    rbf_svm_decision_value: 0.0
    optimized: false
  models:
    logistic_l2:
      estimator: sklearn.linear_model.LogisticRegression
      fixed_parameters:
        penalty: l2
        solver: liblinear
        dual: true
        class_weight: balanced
        max_iter: 10000
        tol: 0.0001
        random_state: 1729
      search_space:
        C: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
    logistic_l1:
      estimator: sklearn.linear_model.LogisticRegression
      fixed_parameters:
        penalty: l1
        solver: liblinear
        dual: false
        class_weight: balanced
        max_iter: 10000
        tol: 0.0001
        random_state: 1729
      search_space:
        C: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
      feature_selection_role: prohibited
    linear_svm:
      estimator: sklearn.svm.LinearSVC
      fixed_parameters:
        penalty: l2
        loss: squared_hinge
        dual: auto
        class_weight: balanced
        max_iter: 20000
        tol: 0.0001
        random_state: 1729
      search_space:
        C: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
    rbf_svm:
      role: secondary_prespecified_baseline
      estimator: sklearn.svm.SVC
      fixed_parameters:
        kernel: rbf
        gamma: scale
        probability: false
        class_weight: balanced
        cache_size: 1024
        tol: 0.001
        random_state: 1729
      search_space:
        C: [0.001, 0.01, 0.1, 1.0, 10.0]
  metrics:
    primary: roc_auc
    secondary:
      - average_precision
      - balanced_accuracy
      - sensitivity_er_positive
      - specificity_er_negative
      - f1_er_positive
      - accuracy
      - confusion_matrix
  bootstrap:
    method: stratified_patient_level_percentile
    n_resamples: 5000
    confidence_level: 0.95
    random_seed: 2718
    paired_indices_across_models: true
  predictions:
    required_columns:
      - patient_id
      - y_true
      - score
      - predicted_class
      - model
      - fold
  outputs:
    artifacts_dir: data/interim/phase1c_classical_baseline_v1
    processed_dir: data/processed/phase1c_classical_baseline_v1
    cv_results: reports/data/phase1c_cv_results.csv
    cv_summary: reports/data/phase1c_cv_summary.csv
    selected_hyperparameters: reports/data/phase1c_selected_hyperparameters.json
    locked_test_performance: reports/data/phase1c_locked_test_performance.json
    leakage_qc: reports/data/phase1c_leakage_qc.json
    provenance: reports/data/phase1c_provenance.json

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  reports_dir: reports/data
