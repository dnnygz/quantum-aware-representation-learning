[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nisq-vqc-breast-cancer"
version = "0.1.0"
description = "Reproducible TCGA-BRCA patient cohort for ER-status classification"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [{name = "Research project contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=14,<22",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
analysis = ["matplotlib==3.10.7"]
notebooks = [
  "nbformat==5.10.4",
  "nbclient==0.10.2",
  "nbconvert==7.16.6",
  "ipykernel==6.30.1",
]
quantum = [
  "torch==2.9.0; python_version >= '3.11'",
  "pennylane==0.43.0; python_version >= '3.11'",
  "gast==0.6.0; python_version >= '3.11'",
  "astunparse==1.6.3; python_version >= '3.11'",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]
xgboost = [
  "xgboost==3.4.1; python_version >= '3.12'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
