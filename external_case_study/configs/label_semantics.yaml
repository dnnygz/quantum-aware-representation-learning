version: phase1c_er_label_semantics_v1
target: baseline_primary_tumor_estrogen_receptor_status
label_field: er_label
class_mapping:
  ER_positive: 1
  ER_negative: 0
positive_class: ER_positive
positive_label: 1
negative_class: ER_negative
negative_label: 0
score_semantics:
  positive_class_probability: probability_ER_positive
  decision_function: increasing_score_supports_ER_positive
metrics:
  primary_model_selection_metric: ROC_AUC
  primary_metric_changed_by_this_audit: false
  er_positive_average_precision:
    labels: er_label
    scores: er_positive_score
  er_negative_average_precision:
    labels: one_minus_er_label
    probability_scores: one_minus_er_positive_probability
    decision_scores: negative_er_positive_decision_score
  confusion_matrix_order:
    sklearn_labels: [0, 1]
    ravel: [TN_ER_negative, FP_ER_negative_as_ER_positive, FN_ER_positive_as_ER_negative, TP_ER_positive]
  er_positive_sensitivity_recall: TP / (TP + FN)
  er_negative_specificity_recall: TN / (TN + FP)
legacy_phase1c_keys:
  pr_auc: ER_positive_average_precision
  sensitivity: ER_positive_sensitivity_recall
  specificity: ER_negative_specificity_recall
frozen_artifacts_policy:
  modify_predictions: false
  modify_selected_hyperparameters: false
  modify_original_performance_artifacts: false
  retrain_or_run_inference: false
